<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1287a0">
    <title>لا يوجد اتصال — عيادة العيون</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            font-family: "IBM Plex Sans Arabic", "Cairo", sans-serif;
            background: linear-gradient(160deg, #e7f3f8, #f4fafc 55%, #dff0f5);
            color: #0a2540;
            text-align: center;
        }
        .box {
            max-width: 26rem;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(18, 135, 160, 0.2);
            border-radius: 1.5rem;
            padding: 1.75rem;
        }
        h1 { margin: 0 0 0.75rem; font-size: 1.75rem; }
        p { margin: 0 0 1.25rem; font-size: 1.1rem; line-height: 1.7; color: #3d5a73; }
        button {
            width: 100%;
            border: 0;
            border-radius: 1rem;
            padding: 1rem 1.25rem;
            font-size: 1.15rem;
            font-weight: 700;
            color: #fff;
            background: #1287a0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>التطبيق مثبت، لكن الصفحة تحتاج شبكة لفتح سجلات المرضى. تحققي من الاتصال ثم أعيدي المحاولة.</p>
        <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
